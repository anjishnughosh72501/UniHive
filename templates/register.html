{% extends 'base.html' %}{% block title %}Create account{% endblock %}{% block content %}<div class="auth-wrap"><div class="auth-card"><div class="auth-icon"><i class="bi bi-person-plus"></i></div><div class="eyebrow text-center">JOIN THE EXCHANGE</div><h1 class="h2 text-center fw-bold mt-2">Create your account</h1><p class="text-secondary text-center mb-4">New accounts start with student access.</p><form method="post"><label class="form-label">Full name</label><input class="form-control mb-3" name="name" required maxlength="100" autocomplete="name" placeholder="Your name"><label class="form-label">Email address</label><input class="form-control mb-3" type="email" name="email" required autocomplete="email" placeholder="you@college.edu"><label class="form-label">Password</label><input class="form-control mb-4" type="password" name="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters"><button class="btn btn-dark w-100 py-2">Create account <i class="bi bi-arrow-right ms-1"></i></button></form><p class="text-center text-secondary small mt-4 mb-0">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p></div></div>{% endblock %}
