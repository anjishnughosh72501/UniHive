{% extends 'base.html' %}{% block title %}List a resource{% endblock %}{% block content %}<div class="page-heading"><div class="eyebrow">RESOURCE OWNER</div><h1 class="display-6 fw-bold mt-2">List a resource</h1><p class="text-secondary">Set clear conditions so people can request access responsibly.</p></div><div class="form-card"><form method="post"><div class="row g-3"><div class="col-md-8"><label class="form-label">Resource name *</label><input class="form-control" name="name" required maxlength="140" placeholder="e.g. Arduino sensor kit"></div><div class="col-md-4"><label class="form-label">Category *</label><input class="form-control" name="category" required maxlength="80" placeholder="e.g. Electronics"></div><div class="col-12"><label class="form-label">Description *</label><textarea class="form-control" name="description" rows="3" required placeholder="What is included and what is it suitable for?"></textarea></div><div class="col-12"><label class="form-label">Pickup location *</label><input class="form-control" name="location" required placeholder="Building, lab or room"></div><div class="col-12"><label class="form-label">Usage rules</label><textarea class="form-control" name="usage_rules" rows="3" placeholder="Safety rules, supervision, return expectations"></textarea></div><div class="col-12"><div class="form-check"><input class="form-check-input" type="checkbox" name="training_required" id="training"><label class="form-check-label" for="training">Require a matching training category before a request can be submitted</label></div></div><div class="col-12 d-flex gap-2 mt-4"><button class="btn btn-dark">Publish resource</button><a class="btn btn-outline-secondary" href="{{ url_for('index') }}">Cancel</a></div></div></form></div>{% endblock %}
